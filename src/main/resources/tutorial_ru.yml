title: 'Замки'
pages:
  - title: 'Автоматическая защита'
    text: |
      Сундуки, бочки, шалкеры, печи и воронки, которые ты ставишь, сразу защищены. Открывать и ломать их можешь только ты. /vlock показывает владельца контейнера; /vlock off снимает защиту.
  - title: 'Друзья и пароли'
    text: |
      /chestbuddy add ИМЯ позволяет другу открывать все твои защищённые контейнеры. /vlock password СЛОВО ставит пароль на контейнер: другие открывают его через /vlock unlock СЛОВО до выхода из игры.
