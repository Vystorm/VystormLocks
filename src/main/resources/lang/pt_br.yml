    description: "Amigos que podem abrir todos os seus contêineres protegidos"
    aliases: []
    sub:
      add:
        name: add
        aliases: []
        description: "Adicionar um amigo de baú"
        args:
          player: JOGADOR
      remove:
        name: remove
        aliases: []
        description: "Remover um amigo de baú"
        args:
          player: JOGADOR
      list:
        name: list
        aliases: []
        description: "Seus amigos de baú"
