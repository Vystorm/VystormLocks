        name: "on"
        aliases: []
        description: "Proteger o contêiner que você olha"
      "off":
        name: "off"
        aliases: []
        description: "Remover sua proteção"
      password:
        name: password
        aliases: []
        description: "Definir uma senha (clear = remover)"
        args:
          password: SENHA
      unlock:
        name: unlock
        aliases: []
        description: "Abrir um contêiner com a senha"
        args:
          password: SENHA
