        name: info
        aliases: []
        description: "Кому принадлежит контейнер перед тобой"
      "on":
        name: "on"
        aliases: []
        description: "Защитить контейнер перед тобой"
      "off":
        name: "off"
        aliases: []
        description: "Снять свою защиту"
