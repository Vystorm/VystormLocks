        name: password
        aliases: []
        description: "Установить пароль (clear = удалить)"
        args:
          password: ПАРОЛЬ
      unlock:
        name: unlock
        aliases: []
        description: "Открыть контейнер по паролю"
        args:
          password: ПАРОЛЬ
  chestbuddy:
    description: "Друзья, которые могут открывать все твои защищённые контейнеры"
    aliases: []
    sub:
      add:
        name: add
        aliases: []
        description: "Добавить друга по сундукам"
        args:
          player: ИГРОК
      remove:
        name: remove
        aliases: []
        description: "Удалить друга по сундукам"
        args:
          player: ИГРОК
      list:
        name: list
        aliases: []
        description: "Твои друзья по сундукам"
