auto-protected: "<gray>🔒 Protégé. Seuls toi et tes amis de coffre peuvent l'ouvrir. <dark_gray>(/vlock)"
protected: "<green>🔒 Ce conteneur est maintenant protégé."
unprotected: "<yellow>🔓 Protection retirée."
already-yours: "<gray>Ce conteneur est déjà protégé par toi."
