    sub:
      info:
        name: info
        aliases: []
        description: "Qui possède le conteneur que tu regardes"
      "on":
        name: "on"
        aliases: []
        description: "Protéger le conteneur que tu regardes"
      "off":
        name: "off"
        aliases: []
        description: "Retirer ta protection"
      password:
        name: password
        aliases: []
        description: "Définir un mot de passe (clear = le retirer)"
        args:
          password: MOT_DE_PASSE
      unlock:
        name: unlock
        aliases: []
        description: "Ouvrir un conteneur avec son mot de passe"
        args:
          password: MOT_DE_PASSE
  chestbuddy:
    description: "Amis qui peuvent ouvrir tous tes conteneurs protégés"
    aliases: []
    sub:
      add:
        name: add
        aliases: []
        description: "Ajouter un ami de coffre"
        args:
          player: JOUEUR
      remove:
        name: remove
        aliases: []
        description: "Retirer un ami de coffre"
        args:
          player: JOUEUR
      list:
        name: list
        aliases: []
        description: "Tes amis de coffre"
